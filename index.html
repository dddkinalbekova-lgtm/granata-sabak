<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Қол гранаталары — Touch сайыс</title><style>body{margin:0;background:radial-gradient(circle at top,#21486c,#081521 70%);color:white;font:22px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:22px}h1{text-align:center;color:#f5d28a;font-size:clamp(30px,4vw,52px)}.muted{text-align:center;color:#b9cfe1}.scores,.controls,.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.score{padding:20px;border:3px solid #56758c;border-radius:18px;text-align:center;background:#173149;cursor:pointer}.score.active{border-color:#f6c767;box-shadow:0 0 22px #f6c76755}.score b{font-size:46px;display:block}button{font:inherit;color:white;background:#225779;border:2px solid #4f8ba8;padding:16px;border-radius:14px;cursor:pointer;min-height:65px}button:disabled{opacity:.45}button:hover{filter:brightness(1.2)}.question{background:#152d44;border:2px solid #3a6685;border-radius:18px;padding:32px;text-align:center;margin:20px 0;font-size:32px;min-height:100px}.answers{grid-template-columns:1fr;gap:12px}.answers button{text-align:left}.answers button.good{background:#197548}.answers button.bad{background:#8b2c3b}.controls{margin:18px 0}.pill{padding:12px;border-radius:12px;background:#233f58;text-align:center}.timer{font-size:40px;font-weight:bold;color:#f6c767}.wheel{height:110px;width:110px;margin:10px auto;border-radius:50%;background:conic-gradient(#e4ac49 0 45deg,#164d79 45deg 90deg,#e4ac49 90deg 135deg,#164d79 135deg 180deg,#e4ac49 180deg 225deg,#164d79 225deg 270deg,#e4ac49 270deg 315deg,#164d79 315deg);border:7px solid #f9e3a7;transition:transform 1s}#feedback{text-align:center;min-height:32px;color:#f6d28a}footer{text-align:center;color:#9bb4c7;font-size:15px}@media(max-width:600px){body{font-size:17px}.question{font-size:23px;padding:18px}.score b{font-size:34px}}</style><main><h1>🛡️ ҚОЛ ГРАНАТАЛАРЫ</h1><p class="muted">10-сынып · Білім мен қауіпсіздік · Touch сайыс</p><div class="scores"><div id="t0" class="score active" onclick="pick(0)">🦅 ҚЫРАН<b id="s0">0</b></div><div id="t1" class="score" onclick="pick(1)">🛡️ СҰҢҚАР<b id="s1">0</b></div></div><div class="controls"><div class="pill">⏱️ Уақыт: <span class="timer" id="clock">30</span> с</div><div class="pill">Сұрақ: <b id="count">1 / 16</b></div></div><div id="wheel" class="wheel"></div><div class="controls"><button onclick="spin()">🎡 Сұрақ дөңгелегін айналдыру</button><button onclick="toggleSound()">🔊 Дыбыс: <span id="sound">Қосулы</span></button></div><div id="stage" class="muted"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><p id="feedback"></p><div class="controls"><button onclick="next()" id="next" disabled>Келесі сұрақ ➜</button><button onclick="restart()">↻ Қайта бастау</button></div><footer>Қауіпсіздік сабағы: нақты жарылғыш заттар қолданылмайды.</footer></main><script>const questions=[["Қол гранатасы дегеніміз не?",["Әскери жарылғыш оқ-дәрі","Байланыс құрылғысы","Қорғаныс киімі"],0],["Жарықшақты гранатаның қауіптілігі?",["Жарылыс пен жарықшақтар","Тек жарық","Тек түтін"],0],["Түтіндік гранатаның жалпы қызметі?",["Түтін түзу","Дыбысты өлшеу","Байланыс орнату"],0],["Оқу макеті не үшін керек?",["Қауіпсіз таныстыру","Жарылыс жасау","Оқ-дәрі сақтау"],0],["Күмәнді затты көрсең?",["Тиіспей алыстау","Ашып қарау","Қолға алу"],0],["Қол гранаталарының жалпы санаттары?",["Жарықшақты және арнайы мақсаттағы","Тек спорттық","Тек оқу"],0],["Белгісіз затты сыртқы түріне қарап қауіпсіз деп тануға бола ма?",["Иә","Жоқ","Түсіне қарап"],1],["Қазақстандағы шұғыл қызмет нөмірі?",["103","112","104"],1],["Сабақта қандай үлгі қолданылады?",["Тексерілген инертті макет","Табылған зат","Нақты оқ-дәрі"],0],["Қауіпті зат маңында адамдар жиналса?",["Алыстап, жауапты адамға хабарлау","Бірге тексеру","Суретке түсіру"],0],["Инертті макет деген не?",["Жарылғыш заты жоқ оқу үлгісі","Нақты жарылғыш","Зақымдалған оқ-дәрі"],0],["Мектеп ауласында күмәнді зат табылса?",["Тиіспей, алыстап, мұғалімге хабарлау","Қолға алу","Басқа жерге апару"],0],["Досың белгісіз әскери затты көрсетсе?",["Жақыннан қарау","Тексеруге көмектесу","Алыстап, ересекке хабарлау"],2],["Күмәнді затқа адамдар жақындаса?",["Затты көтеру","Қауіпсіз жерден ескерту және хабарлау","Қасына бару"],1],["Басты қағида?",["Қауіпсіздік пен жауапкершілік","Жылдамдық","Тәуекел"],0],["Белгісіз жарылғыш затты кім тексереді?",["Оқушы","Арнайы мамандар","Тапқан адам"],1]];let order=questions.map((_,i)=>i),pos=0,team=0,scores=[0,0],done=false,remaining=30,interval=null,sound=true,rotation=0;function tone(f=650){if(!sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=.07;o.start();o.stop(a.currentTime+.16);o.onended=()=>a.close()}catch(e){}}function pick(i){if(done)return;team=i;document.querySelectorAll('.score').forEach((x,j)=>x.classList.toggle('active',i===j))}function draw(){clearInterval(interval);remaining=30;done=false;document.getElementById('clock').textContent=remaining;document.getElementById('next').disabled=true;document.getElementById('feedback').textContent='';document.getElementById('count').textContent=(pos+1)+' / '+order.length;document.getElementById('stage').textContent=['1-кезең: Құпия ұяшықтар','2-кезең: Жылдам жауап','3-кезең: Сәйкестендір','4-кезең: Қауіпсіз шешім','5-кезең: Финал'][Math.min(4,Math.floor(pos/3.2))];let x=questions[order[pos]];document.getElementById('question').textContent=x[0];document.getElementById('answers').innerHTML='';x[1].forEach((v,i)=>{let b=document.createElement('button');b.textContent='ABC'[i]+'. '+v;b.onclick=()=>answer(i);document.getElementById('answers').append(b)});interval=setInterval(()=>{remaining--;document.getElementById('clock').textContent=remaining;if(remaining<=0){clearInterval(interval);done=true;document.getElementById('feedback').textContent='⏰ Уақыт аяқталды';document.getElementById('next').disabled=false;tone(280)}},1000)}function answer(i){if(done)return;done=true;clearInterval(interval);let x=questions[order[pos]],correct=i===x[2],buttons=document.querySelectorAll('#answers button');buttons[x[2]].classList.add('good');if(!correct)buttons[i].classList.add('bad');if(correct){scores[team]+=10;document.getElementById('s'+team).textContent=scores[team]}document.getElementById('feedback').textContent=correct?'✅ Дұрыс! +10 ұпай':'❌ Қате. Дұрыс жауап жасылмен белгіленді.';tone(correct?820:250);document.getElementById('next').disabled=false}function next(){if(!done)return;if(pos===order.length-1){clearInterval(interval);document.getElementById('question').textContent=scores[0]===scores[1]?'🏆 Тең нәтиже!':'🏆 Жеңімпаз: '+(scores[0]>scores[1]?'ҚЫРАН':'СҰҢҚАР');document.getElementById('answers').innerHTML='';document.getElementById('feedback').textContent='Қыран '+scores[0]+' : '+scores[1]+' Сұңқар';document.getElementById('next').disabled=true;return}pos++;pick(1-team);draw()}function spin(){rotation+=720+Math.floor(Math.random()*360);document.getElementById('wheel').style.transform='rotate('+rotation+'deg)';tone(540)}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'Қосулы':'Өшірулі'}function restart(){if(!confirm('Сайысты қайта бастаймыз ба?'))return;pos=0;team=0;scores=[0,0];document.getElementById('s0').textContent=0;document.getElementById('s1').textContent=0;pick(0);draw()}draw();</script></html>
